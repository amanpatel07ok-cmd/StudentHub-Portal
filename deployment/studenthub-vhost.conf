<VirtualHost *:80>
    ServerName studenthub.local
    ServerAlias www.studenthub.local
    DocumentRoot "C:/xampp/htdocs/WDF/StudentHub"

    <Directory "C:/xampp/htdocs/WDF/StudentHub">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/studenthub-error.log"
    CustomLog "logs/studenthub-access.log" common
</VirtualHost>