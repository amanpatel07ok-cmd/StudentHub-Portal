<!DOCTYPE html>

<body>
<header class="header">
<nav class="navbar">

<main>
<div class="welcome-card" style="max-width:600px; margin:40px auto; text-align:left;">
<h2>Contact Us</h2>
<p>Have a question or need help? Send us a message and we will get back to you.</p>
<form class="student-form" style="width:100%; box-shadow:none; padding:0;">
<label for="name">Full Name</label>
<input type="text" id="name" name="name" placeholder="Enter your full name" required>
<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required>
<label for="subject">Subject</label>
<input type="text" id="subject" name="subject" placeholder="Enter subject" required>
<label for="message">Message</label>
<textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
<button type="submit" style="margin-top:20px;">Send Message</button>
</form>
</div>
</main>

</body>
